# Prefill half of the prefill/decode split.
#
# Prefill processes the entire prompt in one parallel pass and produces the KV
# cache. It is compute-bound, so on real hardware it belongs on high-FLOPs
# accelerators. Here it is pinned to k3s-agent-1 by node label, which makes the
# architecture visible in `kubectl get pods -o wide`.
#
# The `app: sim` label is what the InferencePool selects on, so both roles carry
# it. `llm-d.ai/role` is what the endpoint picker's prefill filter matches.
#
# KV CACHE SIMULATION
#   `--enable-kvcache` defaults to FALSE, and while it is off every cache field
#   reports zero no matter what else is configured -- which is why cached_tokens
#   stayed at 0 however many times the same prompt was sent. With it on, the
#   simulator tracks resident blocks, reports cache hits, and publishes
#   BlockStored / BlockRemoved events over ZMQ for the router to index.
#
#   --block-size 64 is not a free choice: it must equal the router's
#   tokenProcessorConfig.blockSizeTokens, or the two sides hash different spans
#   of tokens and no block ever matches.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-prefill
  namespace: llm-d
  labels:
    app: sim
    llm-d.ai/role: prefill
spec:
  # THREE, because one made the A/B experiment meaningless.
  #
  # With a single pod per role the endpoint picker logs `num-of-candidates: 1`
  # — there is no routing decision to make, so "prefix-aware routing" and
  # "round-robin" are the same thing pointed at the same pod. Replicas are the
  # precondition for the comparison, not a refinement of it.
  replicas: 3
  selector:
    matchLabels:
      app: sim
      llm-d.ai/role: prefill
  template:
    metadata:
      labels:
        app: sim
        llm-d.ai/role: prefill
    spec:
      # Set by: kubectl label node k3s-agent-1 llm-d.ai/role=prefill
      nodeSelector:
        llm-d.ai/role: prefill
      containers:
        - name: sim
          # Not a published image: `main` at bf3f6a6 (which contains PR #668) plus a
          # one-line change so KV-event sequence numbers start at 0
          # (llm-d-inference-sim#736). v0.11.2 never binds the KV-events port, and
          # `main` alone has its events dropped by the router. Built on k3s-server
          # and imported into containerd on each node; steps in docs/epp-scheduling.md.
          image: localhost/llm-d-inference-sim:pr668-seq0
          args:
            - "--model"
            - "Qwen/Qwen2.5-1.5B-Instruct"
            - "--port"
            - "8000"
            - "--enable-kvcache"
            - "true"
            - "--block-size"
            - "64"
            # 16 blocks = 1024 tokens, deliberately SMALL.
            #
            # At 1024 blocks (65,536 tokens) every pod could hold every user's
            # context simultaneously, so scattering a conversation cost nothing
            # and round-robin matched prefix-aware routing exactly. Locality
            # only matters when memory is scarce; the first benchmark removed
            # scarcity by accident and then measured its absence.
            #
            # Sized against the workload: shared prompt ~3 blocks, each user's
            # persona ~3 more. Two users concentrated on one pod fit in ~9;
            # six users scattered across every pod need ~21 and evict.
            - "--kv-cache-size"
            - "16"
            # Real token IDs from the shared tokenizer service, so block hashes
            # agree with the router's.
            - "--render-url"
            - "http://render:8082"
            # LATENCY MODEL -- upstream's small-l40s-edge-per-token profile.
            #
            # WITHOUT THIS BLOCK EVERY LATENCY PARAMETER IS ZERO. newConfig()
            # at v0.11.2 sets only time-factor-under-load; validate() bounds-
            # checks the rest but never assigns a default. So prefill, decode
            # and KV transfer all cost NO TIME, and the A/B's latency columns
            # measured scheduling overhead against free backends. A cache hit
            # could not save time because a miss cost none.
            #
            #   prefill_time = prefill-overhead
            #                + (n - n_cached) * prefill-time-per-token
            #
            # n_cached is the cache hit. Multiplied by zero it saves zero --
            # which is why run 2 could never have shown a caching benefit.
            #
            # WHY THE L40S PROFILE AND NOT THE H100 ONE
            #   Upstream ships three hardware targets. This is the "small
            #   (1-3B) model on a single L40S at the edge" one, and the model
            #   here is Qwen2.5-1.5B-Instruct. The 8B/H100 and 70B/8xH100
            #   profiles describe machines this lab is not pretending to be.
            #   Upstream's reference table puts a 1-3B model on an L40S at
            #   80-130ms TTFT and 12-18ms inter-token, which is where these
            #   values land.
            #
            # WHY per-token AND NOT constant
            #   Upstream documents per-token as the one to use when "routing or
            #   scheduling experiments require latency to vary with prompt
            #   size". That is this lab's whole purpose. Leaving
            #   latency-calculator unset -- as it was -- selects a legacy path
            #   upstream labels "not recommended".
            - "--latency-calculator"
            - "per-token"
            - "--prefill-overhead"
            - "20ms"
            - "--prefill-time-per-token"
            - "350us"
            - "--prefill-time-std-dev"
            - "3ms"
            - "--inter-token-latency"
            - "15ms"
            - "--inter-token-latency-std-dev"
            - "2ms"
            # Gives P/D's KV transfer a real cost for the first time: ~4.4ms on
            # a 370-token prompt. Until now it was free, so the disaggregation
            # work measured its orchestration and none of its economics. The
            # profile assumes ~100G Ethernet for cross-node P/D, which is the
            # honest analogue of prefill and decode living on different nodes.
            - "--kv-cache-transfer-time-per-token"
            - "12us"
            - "--kv-cache-transfer-time-std-dev"
            - "500us"
            - "--time-factor-under-load"
            - "1.5"
            # Also part of the profile. NOT a latency parameter -- it caps
            # concurrent sequences per pod, so it changes queue depth and
            # therefore what queue-scorer sees. Included so the profile is
            # adopted whole rather than in pieces; drop it if run 3 needs the
            # latency change isolated from the queueing change.
            - "--max-num-seqs"
            - "4"
            # Publishes block lifecycle events. The router discovers pods and
            # subscribes per pod on this port (podDiscoveryConfig.socketPort).
            - "--zmq-endpoint"
            - "tcp://*:5556"
            # Lets a restarted router rebuild its index from buffered events
            # instead of waiting for live traffic (replaySocketPort).
            - "--kv-events-replay-endpoint"
            - "tcp://*:5559"
            - "--v=4"
          env:
            # The default ZMQ topic is kv@<pod-ip>:<port>@<model>, so the pod
            # needs to know its own address to publish under the right name.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8000
            - name: kv-events
              containerPort: 5556
            - name: kv-replay
              containerPort: 5559
          # A TCP probe rather than an HTTP one: the simulator's health path is
          # not something to guess at, and a wrong path means a pod that never
          # goes Ready for a reason that looks like a crash.
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
