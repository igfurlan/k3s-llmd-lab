# Decode half of the prefill/decode split.
#
# Decode emits output tokens one at a time, re-reading the KV cache prefill
# built. It is memory-bandwidth-bound rather than compute-bound — the opposite
# profile — which is the whole argument for separating the two: sized together,
# a single pod is sized correctly for neither. Pinned to k3s-agent-2.
#
# The `app: sim` label is what the InferencePool selects on, so both roles carry
# it. `llm-d.ai/role` is what the endpoint picker's decode filter matches.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-decode
  namespace: llm-d
  labels:
    app: sim
    llm-d.ai/role: decode
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sim
      llm-d.ai/role: decode
  template:
    metadata:
      labels:
        app: sim
        llm-d.ai/role: decode
    spec:
      # Set by: kubectl label node k3s-agent-2 llm-d.ai/role=decode
      nodeSelector:
        llm-d.ai/role: decode
      containers:
        - name: sim
          image: ghcr.io/llm-d/llm-d-inference-sim:v0.11.2
          args:
            - "--model"
            - "meta-llama/Llama-3.1-8B-Instruct"
            - "--port"
            - "8000"
          ports:
            - name: http
              containerPort: 8000
          # A TCP probe rather than an HTTP one: the simulator's health path is
          # not something to guess at, and a wrong path means a pod that never
          # goes Ready for a reason that looks like a crash.
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
