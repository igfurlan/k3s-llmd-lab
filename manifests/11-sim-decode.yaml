# Decode half of the prefill/decode split.
#
# Decode emits output tokens one at a time, re-reading the KV cache prefill
# built. It is memory-bandwidth-bound rather than compute-bound — the opposite
# profile — which is the whole argument for separating the two: sized together,
# a single pod is sized correctly for neither. Pinned to k3s-agent-2.
#
# The `app: sim` label is what the InferencePool selects on, so both roles carry
# it. `llm-d.ai/role` is what the endpoint picker's decode filter matches.
#
# KV CACHE SIMULATION
#   `--enable-kvcache` defaults to FALSE, and while it is off every cache field
#   reports zero no matter what else is configured -- which is why cached_tokens
#   stayed at 0 however many times the same prompt was sent. With it on, the
#   simulator tracks resident blocks, reports cache hits, and publishes
#   BlockStored / BlockRemoved events over ZMQ for the router to index.
#
#   --block-size 64 is not a free choice: it must equal the router's
#   tokenProcessorConfig.blockSizeTokens, or the two sides hash different spans
#   of tokens and no block ever matches.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sim-decode
  namespace: llm-d
  labels:
    app: sim
    llm-d.ai/role: decode
spec:
  # Three, for the same reason as prefill: with one pod per role the picker
  # has a single candidate and the A/B experiment compares nothing.
  replicas: 3
  selector:
    matchLabels:
      app: sim
      llm-d.ai/role: decode
  template:
    metadata:
      labels:
        app: sim
        llm-d.ai/role: decode
    spec:
      # Set by: kubectl label node k3s-agent-2 llm-d.ai/role=decode
      nodeSelector:
        llm-d.ai/role: decode
      initContainers:
        # THE PIECE THAT MAKES P/D REAL.
        #
        # The EPP picks both pods and stamps the prefill target into an
        # `x-prefiller-host-port` header — but nothing in a model server knows
        # what that header means. This sidecar is what acts on it: a reverse
        # proxy in front of the decode server that intercepts completion
        # requests, drives the prefill worker, arranges the KV transfer, and
        # only then hands the request to the local server to decode.
        #
        # Without it the header is inert and decode prefills locally, which is
        # exactly what the metrics showed: sim-prefill exported no prefix-cache
        # counters at all, because it had served nothing.
        #
        # `restartPolicy: Always` on an initContainer makes this a NATIVE
        # SIDECAR (k8s 1.29+): it starts before the app container and keeps
        # running alongside it, rather than running once and exiting.
        - name: routing-sidecar
          image: ghcr.io/llm-d/llm-d-router-disagg-sidecar:v0.10.0
          restartPolicy: Always
          args:
            # Takes the InferencePool's target port; the simulator moves to 8200.
            - "--port=8000"
            # Default. Names the KV transfer protocol the sidecar speaks to the
            # model servers. Real NIXL needs RDMA-capable hardware; the
            # simulator implements the same request contract and models the
            # transfer as latency, so the orchestration is genuine and only the
            # bytes are imaginary.
            - "--kv-connector=nixlv2"
            # Plain HTTP to the model servers. No TLS inside the pool here.
            - "--secure-proxy=false"
            - "--data-parallel-size=1"
          ports:
            # Named `proxy`, not `http`, and the name carries weight: the
            # PodMonitor selects model-server targets by the port name `http`,
            # which on this pod belongs to the simulator on 8200. Naming both
            # `http` would have Prometheus scrape the proxy as well, producing
            # a second set of series for the same pod.
            - name: proxy
              containerPort: 8000
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          # The sidecar serves GET /health itself; every other path is proxied
          # through to the simulator, /metrics included — which is why the EPP's
          # metrics scrape needs no reconfiguration.
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 10
      containers:
        - name: sim
          # Not a published image: see the note at the same line in 10-sim-prefill.yaml.
          image: localhost/llm-d-inference-sim:pr668-seq0
          args:
            - "--model"
            - "Qwen/Qwen2.5-1.5B-Instruct"
            # 8200, not 8000: the routing sidecar owns the pool's target port
            # and proxies to the simulator here. This is the sidecar's own
            # default for the model server, kept rather than invented.
            - "--port"
            - "8200"
            - "--enable-kvcache"
            - "true"
            - "--block-size"
            - "64"
            # 16 blocks = 1024 tokens. Small on purpose -- see 10-sim-prefill.yaml
            # for the sizing argument. Locality only matters when memory is
            # scarce, and the first benchmark had none.
            - "--kv-cache-size"
            - "16"
            # Real token IDs from the shared tokenizer service, so block hashes
            # agree with the router's.
            - "--render-url"
            - "http://render:8082"
            # LATENCY MODEL -- upstream's small-l40s-edge-per-token profile.
            # Identical to 10-sim-prefill.yaml; the full reasoning is there.
            #
            # In short: without this block every latency parameter is zero, so
            # prefill, decode and KV transfer all cost no time, and a cache hit
            # saved nothing because a miss cost nothing.
            #
            # inter-token-latency matters MORE on this side than on prefill:
            # decode is the phase that emits tokens one at a time, so this is
            # the parameter that makes decode behave like the bandwidth-bound
            # half of the split rather than an instant responder.
            - "--latency-calculator"
            - "per-token"
            - "--prefill-overhead"
            - "20ms"
            - "--prefill-time-per-token"
            - "350us"
            - "--prefill-time-std-dev"
            - "3ms"
            - "--inter-token-latency"
            - "15ms"
            - "--inter-token-latency-std-dev"
            - "2ms"
            # The cost the routing sidecar in front of this pod pays when it
            # fetches a prefill: ~4.4ms on a 370-token prompt. This is what
            # makes nonCachedTokens a real trade-off rather than a free split.
            - "--kv-cache-transfer-time-per-token"
            - "12us"
            - "--kv-cache-transfer-time-std-dev"
            - "500us"
            - "--time-factor-under-load"
            - "1.5"
            # Part of the profile, and not a latency parameter -- see
            # 10-sim-prefill.yaml for why it is here and when to drop it.
            - "--max-num-seqs"
            - "4"
            # Publishes block lifecycle events. The router discovers pods and
            # subscribes per pod on this port (podDiscoveryConfig.socketPort).
            - "--zmq-endpoint"
            - "tcp://*:5556"
            # Lets a restarted router rebuild its index from buffered events
            # instead of waiting for live traffic (replaySocketPort).
            - "--kv-events-replay-endpoint"
            - "tcp://*:5559"
            - "--v=4"
          env:
            # The default ZMQ topic is kv@<pod-ip>:<port>@<model>, so the pod
            # needs to know its own address to publish under the right name.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: http
              containerPort: 8200
            - name: kv-events
              containerPort: 5556
            - name: kv-replay
              containerPort: 5559
          # A TCP probe rather than an HTTP one: the simulator's health path is
          # not something to guess at, and a wrong path means a pod that never
          # goes Ready for a reason that looks like a crash.
          #
          # 8200. Probing 8000 here would still pass — the sidecar shares this
          # network namespace and listens there — so it would report the
          # simulator healthy on the strength of a different process answering.
          readinessProbe:
            tcpSocket:
              port: 8200
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
